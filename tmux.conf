# vi: filetype=tmux

# ==============================================================================
# ENVIRONMENT
# ==============================================================================
# Update Environment
set-option -g  update-environment DISPLAY
set-option -ga update-environment SSH_ASKPASS
set-option -ga update-environment SSH_AUTH_SOCK
set-option -ga update-environment SSH_AGENT_PID
set-option -ga update-environment SSH_CONNECTION
set-option -ga update-environment WINDOWID
set-option -ga update-environment XAUTHORITY

# Disable TMOUT so idle panes don't get killed.
# /etc/profile.d/tmout.sh sets a readonly TMOUT, but only login shells read it, so start panes as non-login shells.
set-environment -gu TMOUT
set-option -g default-command "exec bash"


# ==============================================================================
# SETTINGS
# ==============================================================================
# Display messages longer
set-option -g display-time 1500

# Faster Escape
set-option -sg escape-time 1

#set-option -g terminal-overrides "xterm*:kLFT5=\eOD:kRIT5=\eOC:kUP5=\eOA:kDN5=\eOB:smkx@:rmkx@"
set-window-option -g xterm-keys on

# Disable titles
#set-option -g set-titles on
set-option -g set-titles off
set-option -g set-titles-string ""

# Keep pane on exit
set-option -g remain-on-exit on
# hook: pane-died
# hook: pane-exited

# Enable focus events
set-option -g focus-events on

# Enable true color
# https://stackoverflow.com/questions/62071974/vim-termguicolors-with-xterm-true-color-still-causing-problems
#set-option -g default-terminal screen-256color
#set-option -ag terminal-overrides ",xterm-256color:Tc"

# Enable true color (Alacritty)
# https://gist.github.com/andersevenrud/015e61af2fd264371032763d4ed965b6
#set-option -g default-terminal "tmux-256color"
#set-option -g default-terminal screen-256color
#set-option -g default-terminal alacritty
#set-option -ag terminal-overrides ",xterm-256color:RGB"
#set-option -g terminal-overrides "xterm-256color:RGB"
#set-option -g terminal-overrides "alacritty:RGB"
# Make italics work
set-option -g default-terminal "tmux-256color"
# Required for true color support in Neovim and other TUI apps.
set-option -ag terminal-overrides ",tmux-256color:RGB"

# REVISIT: https://github.com/tmux/tmux/wiki/Clipboard
set-option -g set-clipboard on
set-option -s set-clipboard on

# Allow programs in the pane to bypass tmux using a terminal escape sequence (\ePtmux;...\e\\).
#set-option -g allow-passthrough on


# ==============================================================================
# HOOKS
# ==============================================================================
set-hook -g client-attached 'display-message "Attached to #{session_name}"'
set-hook -g session-created 'display-message "Created #{session_name} session"'

#set-hook -g after-copy-mode 'set-option window-active-style bg=colour200'
#set-hook -g after-copy-mode 'display-message "ENTER COPY MODE"'

# REVISIT: Figure out how to add a hook for exiting copy mode
#set-hook -g after-cancel 'set-option window-active-style bg=colour100'
#set-hook -g after-cancel 'display-message "EXIT COPY MODE"'


# ==============================================================================
# PLUGINS
# ==============================================================================
# --- tmux fuzzback ---
# TODO: Test tmux fuzzback
# https://github.com/roosta/tmux-fuzzback

# --- tmux-prefixless ---
run-shell ~/.config/tmux/plugins/tmux-prefixless/prefixless.tmux

# --- tmux-chameleon ---
run-shell ~/.config/tmux/plugins/tmux-chameleon/chameleon.tmux


# ==============================================================================
# DONE
# ==============================================================================
display-message "Configuration loaded!"

